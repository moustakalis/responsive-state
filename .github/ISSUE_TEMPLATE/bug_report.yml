name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: responsive-state version }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "Chrome 130 / Node 24 / Vite 6" }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, description: A StackBlitz link or code snippet }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual behaviour }
    validations: { required: true }
